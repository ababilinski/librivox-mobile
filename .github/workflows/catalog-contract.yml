name: Catalog contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate shared catalog contract
        run: npm test --prefix catalog-contract
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android deterministic catalog suite
        run: ./gradlew :app:testDebugUnitTest :app:validateDebugScreenshotTest

  swift:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift catalog contract suite
        run: swift test --package-path ios/LibriVoxCore

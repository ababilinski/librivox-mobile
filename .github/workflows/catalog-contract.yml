name: Catalog contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate shared catalog contract
        run: npm test --prefix catalog-contract
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android deterministic catalog suite
        run: ./gradlew :app:testDebugUnitTest :app:validateDebugScreenshotTest :app:assembleDebug
      - name: Save Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/screenshotTest/
            app/build/outputs/screenshotTest-results/
          retention-days: 7

  swift:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift catalog contract suite
        shell: bash
        run: |
          mkdir -p artifacts
          swift test --package-path ios/LibriVoxCore 2>&1 | tee artifacts/swift-tests.log
      - name: Save Swift test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: artifacts/swift-tests.log
          retention-days: 7
